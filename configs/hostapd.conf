# hostapd as a wired 802.1X authenticator (Lab 5 - WPA2-Enterprise)
# Kali Linux, 192.168.100.60 -> RADIUS (NPS) 192.168.100.30
# Lab values only: do not reuse the shared secret anywhere else.

# --- Interface ---------------------------------------------------------
interface=eth0
# VMware NICs are not nl80211 Wi-Fi devices, so use the wired driver
driver=wired

# --- IEEE 802.1X -------------------------------------------------------
ieee8021x=1
eapol_version=1
# Do not authenticate locally: relay every EAP message to RADIUS
eap_server=0

# Source address placed in RADIUS packets (NAS-IP-Address)
own_ip_addr=192.168.100.60

# --- RADIUS authentication server (WS-NPS) -----------------------------
auth_server_addr=192.168.100.30
auth_server_port=1812
# Must match the "AP-Kali" RADIUS client shared secret in NPS
auth_server_shared_secret=Secret@1234

# --- Logging (maximum verbosity for the lab) ---------------------------
logger_stdout=-1
logger_stdout_level=0
logger_syslog=-1
logger_syslog_level=0
